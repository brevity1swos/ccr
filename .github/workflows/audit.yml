name: Scheduled audit

# CI audits on every push/PR, but a new RUSTSEC advisory against an unchanged
# lockfile only shows up on the next push. Check weekly so it surfaces on its
# own (a failed scheduled run notifies the repo owner).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
